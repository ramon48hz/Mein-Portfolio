<!DOCTYPE html>
<html lang="de-CH">

<head>
    <!-- Zeichencodierung -->
    <meta charset="UTF-8">

    <!-- Optimierung für Smartphones und Tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Beschreibung für Suchmaschinen -->
    <meta name="description"
          content="Portfolio eines Media Engineers für Fotografie, Videografie, Social Media und Corporate Communication.">

    <title>Portfolio | Media Engineer</title>

    <!-- CSS-Datei einbinden -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript-Datei einbinden -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ==========================================
         NAVIGATION
         Schwebende Navigation am oberen Bildschirmrand
    =========================================== -->

    <header class="site-header">

        <nav class="navbar" aria-label="Hauptnavigation">

            <!--
                EIGENES LOGO

                Das Logo wird aus dem Assets-Ordner geladen.

                Durch href="#start" gelangt man beim
                Anklicken immer zum Anfang der Startseite.
            -->

            <a href="#start" class="logo" aria-label="Zur Startseite">

                <img
                    src="assets/RLogo.png"
                    alt="Logo"
                    class="logo-image"
                    width="44"
                    height="44"
                >

            </a>

            <!--
                NAVIGATION

                Kunden wurde entfernt.
                Die Schrift wird später über CSS fett dargestellt.
            -->

            <div class="nav-links">

                <a href="#about">Über mich</a>

                <a href="#projects">Projekte</a>

                <a href="#contact">Kontakt</a>

            </div>

        </nav>

    </header>


    <!-- ==========================================
         HAUPTINHALT
    =========================================== -->

    <main>

        <!-- ======================================
             HERO SECTION
             Erster sichtbarer Bereich der Website
        ======================================= -->

        <section class="hero" id="start">

            <!--
                Helligkeitsverlauf über dem Hintergrundbild.
                Verbessert die Lesbarkeit des Textes.
            -->

            <div class="hero-overlay" aria-hidden="true"></div>


            <div class="hero-container">

             <div class="hero-content">

    <!-- ==========================================

         NAME UND BERUFSBEZEICHNUNG

         Kleine Beschriftung über der Headline.

    =========================================== -->

    <p class="eyebrow">

        RAMON KÜNZLE · MEDIA ENGINEER

    </p>

    <!-- ==========================================

         HAUPTÜBERSCHRIFT

         Die vier Tätigkeitsbereiche bilden

         die zentrale Botschaft der Startseite.

    =========================================== -->

    <h1>

        FOTOGRAFIE<br>

        VIDEOGRAFIE<br>

        SOCIAL MEDIA<br>

        CORPORATE

    </h1>

    <!-- ==========================================

         NAVIGATIONSBUTTONS

         Zwei transparente Buttons führen

         zu den entsprechenden Bereichen.

    =========================================== -->

    <div class="hero-buttons">

        <a href="#projects" class="btn btn-outline">

            Projekte entdecken ↗

        </a>

        <a href="#about" class="btn btn-glass">

            Mehr über mich ↓

        </a>

    </div>

    <!-- ==========================================

         KUNDENLOGOS

         Alle Logos werden in Originalfarbe

         dargestellt.

         Reihenfolge:

         Migros, Hertz, Repower, Louis XIV,

         Arboro, TU, MJ.

    =========================================== -->

    <div class="client-logos">

        <img src="assets/Migros.png" alt="Migros">

        <img src="assets/Hertz.png" alt="Hertz">

        <img src="assets/Repower.png" alt="Repower">

        <img src="assets/LouisXIV.png" alt="Louis XIV">

        <img src="assets/Arboro.png" alt="Arboro">

        <img src="assets/TU.png" alt="TU">

        <img src="assets/MJ.png" alt="MJ">

    </div>

</div>

        </section>

        <!-- Weitere Website-Bereiche folgen später -->

    </main>

</body>
</html>
